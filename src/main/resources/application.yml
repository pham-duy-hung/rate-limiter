server:
  port: 8080

ratelimiter:
  enabled: true
  default-limit: 100
  default-window-seconds: 60
  api-key-header: X-API-Key
  trust-forwarded-for: false
  idle-eviction-seconds: 3600

  spring:
    data:
      redis:
        host: localhost
        port: 6379
        timeout: 200ms
        connect-timeout: 200ms

  ratelimiter:
    store: memory            # memory hoặc redis
    redis:
      key-prefix: rl
      fail-open: true
