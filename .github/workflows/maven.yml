name: CI
 
on:
  push:
    branches: [main, master]
  pull_request:
 
jobs:
  test:
    runs-on: ubuntu-latest
 
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
 
      - name: Run tests
        run: mvn -B test
